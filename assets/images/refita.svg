<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="refitaAura" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#9f1239" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitRefita" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#2a030d"/>
    </linearGradient>
    <filter id="shadowRefita" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="200" cy="180" r="170" fill="url(#refitaAura)"/>

  <g filter="url(#shadowRefita)">
    <!-- Elegant long hair / Hijab drapery base -->
    <path d="M120 160 Q120 70 200 60 Q280 70 280 160 Q285 280 260 360 Q200 330 140 360 Q115 280 120 160 Z" fill="#0f172a"/>
    
    <!-- Face -->
    <ellipse cx="200" cy="160" rx="54" ry="64" fill="#ffedd5"/>
    
    <!-- Hair bang / front framing -->
    <path d="M146 150 Q160 85 200 80 Q240 85 254 150 Q230 110 200 112 Q170 110 146 150 Z" fill="#1e293b"/>

    <!-- Eyebrows and Bright Welcoming Eyes -->
    <path d="M162 144 Q175 138 186 144" stroke="#18181b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M214 144 Q225 138 238 144" stroke="#18181b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="174" cy="156" r="4.5" fill="#18181b"/>
    <circle cx="226" cy="156" r="4.5" fill="#18181b"/>
    <circle cx="176" cy="154" r="1.5" fill="#ffffff"/>
    <circle cx="228" cy="154" r="1.5" fill="#ffffff"/>
    <!-- Gentle lashes -->
    <path d="M168 152 L164 149 M232 152 L236 149" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose & Warm Smile -->
    <path d="M200 160 L197 178 L203 178" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M186 195 Q200 207 214 195" stroke="#be123c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <ellipse cx="160" cy="175" rx="8" ry="4" fill="#fda4af" opacity="0.6"/>
    <ellipse cx="240" cy="175" rx="8" ry="4" fill="#fda4af" opacity="0.6"/>

    <!-- Elegant Blazer / Attire -->
    <path d="M85 500 L85 340 Q85 250 160 250 L240 250 Q315 250 315 340 L315 500 Z" fill="url(#suitRefita)"/>
    
    <!-- Silk Scarf / Inner Blouse -->
    <path d="M170 250 Q200 290 230 250 Q215 380 200 400 Q185 380 170 250 Z" fill="#fda4af"/>
    <polygon points="170,250 190,300 200,270 190,250" fill="#fecdd3"/>
    <polygon points="230,250 210,300 200,270 210,250" fill="#fecdd3"/>

    <!-- Gold Feather Pen Pin (Documenter Badge) -->
    <circle cx="132" cy="320" r="13" fill="#be123c" stroke="#facc15" stroke-width="2"/>
    <path d="M125 327 L135 313 Q139 313 138 317 L128 327 Z" fill="#facc15"/>
  </g>
</svg>