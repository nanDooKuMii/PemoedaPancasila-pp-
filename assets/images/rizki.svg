<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="rizkiAura" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitRizki" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowRizki" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="200" cy="180" r="170" fill="url(#rizkiAura)"/>

  <g filter="url(#shadowRizki)">
    <!-- Neck -->
    <rect x="180" y="210" width="40" height="60" rx="8" fill="#fed7aa"/>
    <!-- Head Base -->
    <ellipse cx="200" cy="160" rx="58" ry="68" fill="#fed7aa"/>
    
    <!-- Ears -->
    <ellipse cx="140" cy="162" rx="10" ry="16" fill="#fed7aa"/>
    <ellipse cx="260" cy="162" rx="10" ry="16" fill="#fed7aa"/>

    <!-- Hair (Creative textured modern hair) -->
    <path d="M136 155 Q135 68 200 64 Q265 68 264 155 Q240 100 200 105 Q160 100 136 155 Z" fill="#18181b"/>
    <path d="M160 85 Q190 65 245 80 Q225 72 180 75 Z" fill="#3f3f46"/>

    <!-- Eyebrows and Creative Focus Eyes -->
    <path d="M160 144 Q175 138 188 144" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M212 144 Q225 138 240 144" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="174" cy="157" r="5" fill="#18181b"/>
    <circle cx="226" cy="157" r="5" fill="#18181b"/>
    <circle cx="176" cy="155" r="1.5" fill="#ffffff"/>
    <circle cx="228" cy="155" r="1.5" fill="#ffffff"/>

    <!-- Nose & Smile -->
    <path d="M200 160 L196 178 L204 178" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M185 196 Q200 207 215 196" stroke="#991b1b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Modern Creative Jacket -->
    <path d="M85 500 L85 340 Q85 250 160 250 L240 250 Q315 250 315 340 L315 500 Z" fill="url(#suitRizki)"/>
    
    <!-- Inner Shirt & Batik Pattern Accent Collar -->
    <polygon points="200,350 160,250 240,250" fill="#ffffff"/>
    <polygon points="160,250 185,295 200,270 190,250" fill="#f8fafc"/>
    <polygon points="240,250 215,295 200,270 210,250" fill="#f8fafc"/>
    
    <!-- Designer Palette / Creative Pin -->
    <circle cx="132" cy="320" r="12" fill="#047857"/>
    <circle cx="129" cy="317" r="2.5" fill="#fbbf24"/>
    <circle cx="135" cy="317" r="2.5" fill="#ef4444"/>
    <circle cx="132" cy="323" r="2.5" fill="#38bdf8"/>
    
    <path d="M190 280 L210 280 L200 370 Z" fill="#059669" opacity="0.85"/>
  </g>
</svg>