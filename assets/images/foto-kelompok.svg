<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="groupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="stageLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="batikMini" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 Q25 10 20 20 Q15 10 20 0 Z" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M0 20 Q10 25 20 20 Q10 15 0 20 Z" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M20 40 Q25 30 20 20 Q15 30 20 40 Z" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M40 20 Q30 25 20 20 Q30 15 40 20 Z" fill="#ffffff" fill-opacity="0.06"/>
      <circle cx="20" cy="20" r="3" fill="#d4af37" fill-opacity="0.2"/>
    </pattern>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="600" fill="url(#groupBg)"/>
  <rect width="1200" height="600" fill="url(#batikMini)"/>
  <rect width="1200" height="600" fill="url(#stageLight)"/>

  <!-- Gold Border Frame Accents -->
  <rect x="20" y="20" width="1160" height="560" rx="16" fill="none" stroke="url(#goldRim)" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="544" rx="12" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Corner Garuda Ornaments -->
  <g fill="#d4af37" opacity="0.6">
    <path d="M40 40 L65 40 L65 44 L44 44 L44 65 L40 65 Z"/>
    <circle cx="44" cy="44" r="2.5"/>
    <path d="M1160 40 L1135 40 L1135 44 L1156 44 L1156 65 L1160 65 Z"/>
    <circle cx="1156" cy="44" r="2.5"/>
    <path d="M40 560 L65 560 L65 556 L44 556 L44 535 L40 535 Z"/>
    <circle cx="44" cy="556" r="2.5"/>
    <path d="M1160 560 L1135 560 L1135 556 L1156 556 L1156 535 L1160 535 Z"/>
    <circle cx="1156" cy="556" r="2.5"/>
  </g>

  <!-- Glow Platform -->
  <ellipse cx="600" cy="530" rx="460" ry="45" fill="#000000" fill-opacity="0.4"/>
  <ellipse cx="600" cy="525" rx="380" ry="25" fill="#fef08a" fill-opacity="0.12"/>

  <!-- 5 Silhouette Figures with Distinct Modern Colors & Badges -->

  <!-- Figure 1: Rizki (Leftmost) -->
  <g transform="translate(180, 160)" filter="url(#dropShadow)">
    <circle cx="70" cy="65" r="42" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M30 65 Q35 25 70 20 Q105 25 110 65 Q95 45 70 48 Q45 45 30 65 Z" fill="#1e293b"/>
    <!-- Torso / Clothes -->
    <path d="M20 280 L20 165 Q20 120 70 120 Q120 120 120 165 L120 280 Z" fill="#334155"/>
    <!-- Collar & Red-White Pin -->
    <polygon points="70,140 50,120 90,120" fill="#ffffff"/>
    <rect x="62" y="160" width="16" height="8" rx="2" fill="#ef4444"/>
    <rect x="62" y="168" width="16" height="8" rx="2" fill="#ffffff"/>
    <text x="70" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">RIZKI</text>
    <text x="70" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">Desain &amp; Visual</text>
  </g>

  <!-- Figure 2: Mirza (Left Center) -->
  <g transform="translate(370, 140)" filter="url(#dropShadow)">
    <circle cx="70" cy="65" r="44" fill="#ffedd5"/>
    <!-- Hair -->
    <path d="M28 65 Q35 20 70 18 Q105 20 112 65 Q95 40 70 42 Q45 40 28 65 Z" fill="#0f172a"/>
    <!-- Glasses -->
    <rect x="42" y="58" width="22" height="14" rx="4" fill="none" stroke="#0284c7" stroke-width="3"/>
    <rect x="76" y="58" width="22" height="14" rx="4" fill="none" stroke="#0284c7" stroke-width="3"/>
    <line x1="64" y1="65" x2="76" y2="65" stroke="#0284c7" stroke-width="3"/>
    <!-- Torso -->
    <path d="M15 300 L15 170 Q15 125 70 125 Q125 125 125 170 L125 300 Z" fill="#1e293b"/>
    <!-- Shirt -->
    <polygon points="70,150 48,125 92,125" fill="#f1f5f9"/>
    <polygon points="70,165 64,150 76,150" fill="#dc2626"/>
    <text x="70" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">MIRZA</text>
    <text x="70" y="362" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">Riset &amp; Materi</text>
  </g>

  <!-- Figure 3: Nando (Center - Leader, slightly taller) -->
  <g transform="translate(530, 110)" filter="url(#dropShadow)">
    <!-- Aura glow -->
    <circle cx="70" cy="65" r="60" fill="#f59e0b" fill-opacity="0.15"/>
    <circle cx="70" cy="65" r="48" fill="#fed7aa"/>
    <!-- Modern stylish hair -->
    <path d="M24 65 Q30 12 70 10 Q110 12 116 65 Q95 35 70 38 Q45 35 24 65 Z" fill="#09090b"/>
    <!-- Leader Blazer (Red-maroon with gold trim) -->
    <path d="M10 330 L10 175 Q10 130 70 130 Q130 130 130 175 L130 330 Z" fill="#881337"/>
    <!-- Inner White Shirt & Tie -->
    <polygon points="70,185 45,130 95,130" fill="#ffffff"/>
    <path d="M66 160 L74 160 L78 240 L70 255 L62 240 Z" fill="#d97706"/>
    <!-- Badge -->
    <circle cx="45" cy="180" r="7" fill="#fbbf24"/>
    <text x="70" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">NANDO</text>
    <rect x="25" y="382" width="90" height="22" rx="11" fill="#d97706" fill-opacity="0.3"/>
    <text x="70" y="397" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle">KETUA KELOMPOK</text>
  </g>

  <!-- Figure 4: Odit (Right Center) -->
  <g transform="translate(690, 140)" filter="url(#dropShadow)">
    <circle cx="70" cy="65" r="44" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M26 65 Q35 18 70 16 Q105 18 114 65 Q92 38 70 40 Q48 38 26 65 Z" fill="#18181b"/>
    <!-- Torso -->
    <path d="M15 300 L15 170 Q15 125 70 125 Q125 125 125 170 L125 300 Z" fill="#1e3a5f"/>
    <!-- Inner Shirt -->
    <polygon points="70,150 48,125 92,125" fill="#f8fafc"/>
    <rect x="63" y="165" width="14" height="14" rx="2" fill="#d97706"/>
    <text x="70" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">ODIT</text>
    <text x="70" y="362" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">Analisis Kasus</text>
  </g>

  <!-- Figure 5: Refita (Rightmost) -->
  <g transform="translate(880, 160)" filter="url(#dropShadow)">
    <circle cx="70" cy="65" r="42" fill="#fed7aa"/>
    <!-- Long Hair / Hijab/Style -->
    <path d="M25 65 Q30 20 70 18 Q110 20 115 65 Q125 120 115 160 Q70 150 25 160 Q15 120 25 65 Z" fill="#0f172a"/>
    <circle cx="70" cy="65" r="34" fill="#ffedd5"/>
    <!-- Female Outfit with elegant scarf -->
    <path d="M20 280 L20 165 Q20 120 70 120 Q120 120 120 165 L120 280 Z" fill="#4c0519"/>
    <path d="M45 130 Q70 160 95 130 Q85 200 70 230 Q55 200 45 130 Z" fill="#fb7185"/>
    <text x="70" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">REFITA</text>
    <text x="70" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">Dokumentasi</text>
  </g>

  <!-- Banner Bottom Tag -->
  <g transform="translate(600, 560)">
    <rect x="-190" y="-18" width="380" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      ★ KELOMPOK PANCASILA • 5 ANGGOTA ★
    </text>
  </g>
</svg>