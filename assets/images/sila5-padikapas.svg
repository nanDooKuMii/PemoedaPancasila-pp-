<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWhite5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="riceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="padiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield Section: White (Putih) -->
  <rect width="200" height="200" rx="24" fill="url(#bgWhite5)"/>
  <rect width="192" height="192" x="4" y="4" rx="20" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Padi (Kiri) & Kapas (Kanan) Stalks -->
  <g transform="translate(100, 105)" filter="url(#padiShadow)">
    <!-- Base Ribbon tying them together -->
    <path d="M-15 65 Q0 60 15 65 Q25 75 10 80 Q0 68 -10 80 Q-25 75 -15 65 Z" fill="#dc2626"/>
    <circle cx="0" cy="65" r="4.5" fill="#fef08a"/>

    <!-- LEFT STALK: Padi (Golden Rice Grains) -->
    <path d="M-5 65 C-25 45 -45 10 -40 -35 C-38 -55 -25 -70 -12 -75" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Rice Grains along stalk -->
    <!-- Grains 1-10 -->
    <ellipse cx="-16" cy="50" rx="6" ry="3" fill="url(#riceGold)" transform="rotate(-30 -16 50)"/>
    <ellipse cx="-26" cy="38" rx="6" ry="3" fill="url(#riceGold)" transform="rotate(-40 -26 38)"/>
    <ellipse cx="-34" cy="22" rx="6.5" ry="3.2" fill="url(#riceGold)" transform="rotate(-50 -34 22)"/>
    <ellipse cx="-39" cy="5" rx="7" ry="3.5" fill="url(#riceGold)" transform="rotate(-60 -39 5)"/>
    <ellipse cx="-41" cy="-12" rx="7" ry="3.5" fill="url(#riceGold)" transform="rotate(-70 -41 -12)"/>
    <ellipse cx="-38" cy="-30" rx="7" ry="3.5" fill="url(#riceGold)" transform="rotate(-85 -38 -30)"/>
    <ellipse cx="-32" cy="-46" rx="6.5" ry="3.2" fill="url(#riceGold)" transform="rotate(-105 -32 -46)"/>
    <ellipse cx="-23" cy="-60" rx="6" ry="3" fill="url(#riceGold)" transform="rotate(-125 -23 -60)"/>
    <ellipse cx="-12" cy="-72" rx="5" ry="2.8" fill="url(#riceGold)" transform="rotate(-140 -12 -72)"/>
    <!-- Inner companion grains -->
    <ellipse cx="-10" cy="42" rx="5.5" ry="2.8" fill="url(#riceGold)" transform="rotate(20 -10 42)"/>
    <ellipse cx="-18" cy="26" rx="6" ry="3" fill="url(#riceGold)" transform="rotate(10 -18 26)"/>
    <ellipse cx="-24" cy="10" rx="6.5" ry="3.2" fill="url(#riceGold)" transform="rotate(0 -24 10)"/>
    <ellipse cx="-27" cy="-7" rx="6.5" ry="3.2" fill="url(#riceGold)" transform="rotate(-15 -27 -7)"/>
    <ellipse cx="-24" cy="-24" rx="6.5" ry="3.2" fill="url(#riceGold)" transform="rotate(-30 -24 -24)"/>

    <!-- RIGHT STALK: Kapas (Cotton Balls & Green Sepals) -->
    <path d="M5 65 C25 45 45 10 40 -35 C38 -55 25 -70 12 -75" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Cotton Boll 1 -->
    <g transform="translate(18, 42)">
      <!-- Green Sepal -->
      <path d="M-8 4 Q0 12 8 4 Q0 -2 -8 4 Z" fill="#166534"/>
      <!-- White Fluffy Cotton -->
      <circle cx="-5" cy="-2" r="6.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="5" cy="-2" r="6.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-7" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Cotton Boll 2 -->
    <g transform="translate(32, 18)">
      <path d="M-8 4 Q0 12 8 4 Q0 -2 -8 4 Z" fill="#166534" transform="rotate(15)"/>
      <circle cx="-5" cy="-2" r="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="5" cy="-2" r="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-8" r="7.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Cotton Boll 3 -->
    <g transform="translate(38, -12)">
      <path d="M-8 4 Q0 12 8 4 Q0 -2 -8 4 Z" fill="#166534" transform="rotate(30)"/>
      <circle cx="-5" cy="-2" r="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="5" cy="-2" r="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-8" r="7.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Cotton Boll 4 -->
    <g transform="translate(32, -42)">
      <path d="M-8 4 Q0 12 8 4 Q0 -2 -8 4 Z" fill="#166534" transform="rotate(45)"/>
      <circle cx="-5" cy="-2" r="6.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="5" cy="-2" r="6.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-7" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Cotton Boll 5 (Top tip) -->
    <g transform="translate(16, -68)">
      <path d="M-6 4 Q0 10 6 4 Q0 -2 -6 4 Z" fill="#166534" transform="rotate(60)"/>
      <circle cx="-4" cy="-2" r="5.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="4" cy="-2" r="5.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-6" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    </g>
  </g>
</svg>