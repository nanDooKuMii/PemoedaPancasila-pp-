<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mirzaAura" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitMirza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadowMirza" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="200" cy="180" r="170" fill="url(#mirzaAura)"/>

  <g filter="url(#shadowMirza)">
    <!-- Neck -->
    <rect x="180" y="210" width="40" height="60" rx="8" fill="#fde047" fill-opacity="0.2"/>
    <!-- Head Base -->
    <ellipse cx="200" cy="160" rx="58" ry="68" fill="#ffedd5"/>
    
    <!-- Ears -->
    <ellipse cx="140" cy="162" rx="10" ry="16" fill="#ffedd5"/>
    <ellipse cx="260" cy="162" rx="10" ry="16" fill="#ffedd5"/>

    <!-- Hair (Smart side-parted intellectual look) -->
    <path d="M138 152 Q142 65 200 62 Q262 68 260 152 Q230 110 195 112 Q158 110 138 152 Z" fill="#0f172a"/>
    <path d="M150 90 Q180 72 230 90 Q200 80 165 82 Z" fill="#334155"/>

    <!-- Glasses (Smart / Research Specialist look) -->
    <rect x="152" y="145" width="34" height="24" rx="6" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="3.5"/>
    <rect x="214" y="145" width="34" height="24" rx="6" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="3.5"/>
    <line x1="186" y1="154" x2="214" y2="154" stroke="#0284c7" stroke-width="3.5"/>
    <line x1="140" y1="152" x2="152" y2="154" stroke="#0284c7" stroke-width="3"/>
    <line x1="248" y1="154" x2="260" y2="152" stroke="#0284c7" stroke-width="3"/>

    <!-- Eyes Behind Glasses -->
    <circle cx="169" cy="157" r="4.5" fill="#0f172a"/>
    <circle cx="231" cy="157" r="4.5" fill="#0f172a"/>
    <circle cx="171" cy="155" r="1.5" fill="#ffffff"/>
    <circle cx="233" cy="155" r="1.5" fill="#ffffff"/>

    <!-- Nose & Warm Smile -->
    <path d="M200 162 L196 178 L203 178" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M186 195 Q200 205 214 195" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Formal Attire -->
    <path d="M85 500 L85 340 Q85 250 165 250 L235 250 Q315 250 315 340 L315 500 Z" fill="url(#suitMirza)"/>
    
    <!-- Crisp Shirt & Maroon Accent -->
    <polygon points="200,360 165,250 235,250" fill="#f8fafc"/>
    <polygon points="165,250 188,300 200,270 192,250" fill="#e2e8f0"/>
    <polygon points="235,250 212,300 200,270 208,250" fill="#e2e8f0"/>
    
    <!-- Pen Pocket & Red-White Ribbon Pin -->
    <rect x="250" y="320" width="30" height="4" rx="2" fill="#d4af37"/>
    <rect x="258" y="310" width="3" height="14" rx="1" fill="#cbd5e1"/>
    
    <rect x="125" y="315" width="22" height="6" rx="2" fill="#ef4444"/>
    <rect x="125" y="321" width="22" height="6" rx="2" fill="#ffffff"/>
  </g>
</svg>