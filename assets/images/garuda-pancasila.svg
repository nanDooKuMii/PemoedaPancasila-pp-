<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" id="garudaMasterSvg">
  <defs>
    <!-- Gold Feathers Shading -->
    <linearGradient id="garudaGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="garudaGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <radialGradient id="garudaAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Shield Rim & Equator -->
    <linearGradient id="shieldGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="garudaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="shieldHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Solar Aura -->
  <circle cx="400" cy="380" r="350" fill="url(#garudaAura)"/>

  <!-- Master Group with 3D Shadow -->
  <g filter="url(#garudaGlow)" id="garudaBodyGroup">

    <!-- ================= 1. TAIL FEATHERS (8 FEATHERS) ================= -->
    <g id="tailFeathers" fill="url(#garudaGoldLight)" stroke="url(#garudaGoldDark)" stroke-width="2">
      <!-- 8 Fan Feathers -->
      <path d="M400 520 C380 580 340 680 310 710 C325 715 345 680 370 610 Z"/>
      <path d="M400 520 C385 590 365 690 350 730 C365 735 385 680 390 610 Z"/>
      <path d="M400 520 C395 590 385 710 385 745 C395 748 405 710 405 610 Z"/>
      <path d="M400 520 C405 590 415 710 415 745 C405 748 395 710 395 610 Z"/>
      <path d="M400 520 C415 590 435 690 450 730 C435 735 415 680 410 610 Z"/>
      <path d="M400 520 C420 580 460 680 490 710 C475 715 455 680 430 610 Z"/>
      <!-- Outer Tail accents -->
      <path d="M400 520 C360 560 300 640 270 670 C285 675 320 630 360 570 Z"/>
      <path d="M400 520 C440 560 500 640 530 670 C515 675 480 630 440 570 Z"/>
      <!-- Tail Base 19 Small Feathers -->
      <path d="M360 520 Q400 545 440 520 Q400 535 360 520 Z" fill="#ca8a04"/>
    </g>

    <!-- ================= 2. LEFT WING (17 FEATHERS) ================= -->
    <g id="leftWing" fill="url(#garudaGoldLight)" stroke="url(#garudaGoldDark)" stroke-width="2">
      <!-- Outer Primary Feathers -->
      <path d="M330 320 C260 270 120 180 50 130 C45 140 120 220 280 340 Z"/>
      <path d="M330 325 C250 285 110 215 55 165 C52 175 125 245 280 355 Z"/>
      <path d="M330 330 C240 300 105 250 65 205 C62 215 130 275 285 370 Z"/>
      <path d="M330 340 C230 320 100 285 80 250 C80 260 140 310 290 385 Z"/>
      <path d="M330 350 C230 340 110 325 98 295 C100 305 155 345 295 400 Z"/>
      <path d="M330 360 C230 365 125 365 120 345 C122 355 170 385 300 415 Z"/>
      <path d="M330 375 C240 395 145 410 145 395 C150 405 190 425 305 430 Z"/>
      <path d="M330 390 C250 425 170 455 175 445 C180 455 220 465 310 445 Z"/>
      <!-- Inner Layer Feathers -->
      <path d="M330 340 C270 310 180 250 130 200 C150 250 240 330 320 370 Z" fill="url(#garudaGoldDark)"/>
      <path d="M330 360 C265 345 175 305 145 265 C165 305 245 365 320 395 Z" fill="url(#garudaGoldDark)"/>
      <path d="M330 380 C270 380 190 360 170 330 C185 360 250 400 320 415 Z" fill="url(#garudaGoldDark)"/>
    </g>

    <!-- ================= 3. RIGHT WING (17 FEATHERS) ================= -->
    <g id="rightWing" fill="url(#garudaGoldLight)" stroke="url(#garudaGoldDark)" stroke-width="2">
      <!-- Outer Primary Feathers -->
      <path d="M470 320 C540 270 680 180 750 130 C755 140 680 220 520 340 Z"/>
      <path d="M470 325 C550 285 690 215 745 165 C748 175 675 245 520 355 Z"/>
      <path d="M470 330 C560 300 695 250 735 205 C738 215 670 275 515 370 Z"/>
      <path d="M470 340 C570 320 700 285 720 250 C720 260 660 310 510 385 Z"/>
      <path d="M470 350 C570 340 690 325 702 295 C700 305 645 345 505 400 Z"/>
      <path d="M470 360 C570 365 675 365 680 345 C678 355 630 385 500 415 Z"/>
      <path d="M470 375 C560 395 655 410 655 395 C650 405 610 425 495 430 Z"/>
      <path d="M470 390 C550 425 630 455 625 445 C620 455 580 465 490 445 Z"/>
      <!-- Inner Layer Feathers -->
      <path d="M470 340 C530 310 620 250 670 200 C650 250 560 330 480 370 Z" fill="url(#garudaGoldDark)"/>
      <path d="M470 360 C535 345 625 305 655 265 C635 305 555 365 480 395 Z" fill="url(#garudaGoldDark)"/>
      <path d="M470 380 C530 380 610 360 630 330 C615 360 550 400 480 415 Z" fill="url(#garudaGoldDark)"/>
    </g>

    <!-- ================= 4. BODY, NECK (45 FEATHERS) & HEAD ================= -->
    <g id="headAndNeck" fill="url(#garudaGoldLight)" stroke="url(#garudaGoldDark)">
      <!-- Neck Base & Feather Scales (Melambangkan 45 helai leher) -->
      <path d="M360 320 C360 220 380 160 400 120 C420 160 440 220 440 320 Z" stroke-width="2"/>
      
      <!-- Scaled Neck Feathers Texture -->
      <g fill="#eab308" stroke="#a16207" stroke-width="1.5">
        <path d="M380 160 Q400 170 420 160 Q400 180 380 160 Z"/>
        <path d="M375 180 Q400 195 425 180 Q400 200 375 180 Z"/>
        <path d="M370 200 Q400 215 430 200 Q400 220 370 200 Z"/>
        <path d="M365 220 Q400 235 435 220 Q400 240 365 220 Z"/>
        <path d="M360 245 Q400 260 440 245 Q400 265 360 245 Z"/>
      </g>

      <!-- Head Facing Right (Gagah Menghadap ke Kanan) -->
      <!-- Crest / Jambul -->
      <path d="M370 120 C350 90 380 60 420 50 C410 70 425 80 440 90 C425 95 430 110 445 115 C425 125 410 125 390 125 Z" fill="url(#garudaGoldLight)" stroke-width="2"/>
      <!-- Beak (Paruh Emas Tajam) -->
      <path d="M430 100 C465 105 490 120 495 135 C475 142 455 130 435 130 Z" fill="#d97706" stroke="#92400e" stroke-width="2"/>
      <path d="M435 130 C455 132 470 145 475 150 C460 150 440 142 430 138 Z" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>
      <!-- Sharp Eye -->
      <circle cx="420" cy="112" r="7" fill="#ffffff" stroke="#713f12" stroke-width="1.5"/>
      <circle cx="422" cy="112" r="4" fill="#09090b"/>
      <circle cx="424" cy="110" r="1.5" fill="#ffffff"/>
      <path d="M410 104 Q425 102 432 108" stroke="#713f12" stroke-width="2.5" fill="none"/>
    </g>

    <!-- ================= 5. CLAWS & BANNER BHINNEKA TUNGGAL IKA ================= -->
    <g id="bannerAndClaws">
      <!-- Ribbon White / Gold Banner -->
      <g filter="url(#shieldHighlight)">
        <!-- Ribbon Ends (Folded Tails) -->
        <path d="M160 635 L120 620 L135 655 L120 690 L165 675 L200 660 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <path d="M640 635 L680 620 L665 655 L680 690 L635 675 L600 660 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        
        <!-- Main Ribbon Body -->
        <path d="M150 645 Q400 680 650 645 L650 605 Q400 640 150 605 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <path d="M150 605 Q400 640 650 605" stroke="#d4af37" stroke-width="3" fill="none"/>
        <path d="M150 645 Q400 680 650 645" stroke="#d4af37" stroke-width="3" fill="none"/>

        <!-- Inscription Text: BHINNEKA TUNGGAL IKA -->
        <text x="400" y="636" font-family="'Cinzel', 'Times New Roman', serif" font-size="22" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="5">
          BHINNEKA TUNGGAL IKA
        </text>
      </g>

      <!-- Claws Gripping Ribbon (Cakar Emas) -->
      <!-- Left Claw -->
      <g fill="#d97706" stroke="#78350f" stroke-width="2">
        <path d="M290 560 C290 580 280 605 285 615 C295 615 305 590 305 565 Z"/>
        <path d="M305 560 C310 585 305 610 315 620 C325 615 325 585 320 560 Z"/>
        <path d="M325 560 C330 580 330 605 340 615 C350 610 345 580 340 560 Z"/>
      </g>
      <!-- Right Claw -->
      <g fill="#d97706" stroke="#78350f" stroke-width="2">
        <path d="M460 560 C455 580 455 605 445 615 C435 610 440 580 445 560 Z"/>
        <path d="M475 560 C470 585 475 610 465 620 C455 615 455 585 460 560 Z"/>
        <path d="M495 560 C495 580 505 605 500 615 C490 615 480 590 480 565 Z"/>
      </g>
    </g>

    <!-- ================= 6. INTERACTIVE CENTRAL SHIELD (PERISAI 5 SILA) ================= -->
    <g id="garudaShieldMaster" transform="translate(0, 0)" filter="url(#shieldHighlight)" style="cursor: pointer;">
      
      <!-- Golden Outer Shield Frame -->
      <path d="M400 240 C520 240 560 300 560 410 C560 520 450 560 400 590 C350 560 240 520 240 410 C240 300 280 240 400 240 Z" fill="url(#shieldGoldRim)" stroke="#fef08a" stroke-width="4"/>
      
      <!-- Inner Shield Margin -->
      <path d="M400 250 C510 250 546 305 546 408 C546 510 445 548 400 575 C355 548 254 510 254 408 C254 305 290 250 400 250 Z" fill="#0f172a"/>

      <!-- ClipPath for Shield Quadrants -->
      <clipPath id="shieldClip">
        <path d="M400 252 C508 252 544 306 544 407 C544 508 444 546 400 572 C356 546 256 508 256 407 C256 306 292 252 400 252 Z"/>
      </clipPath>

      <g clip-path="url(#shieldClip)">
        <!-- QUADRANT 1: TOP-LEFT (SILA 4: Kepala Banteng - Red Background) -->
        <g id="quadSila4" class="shield-quadrant" data-sila="4">
          <rect x="250" y="250" width="150" height="155" fill="#991b1b"/>
          <!-- Mini Emblem Sila 4 (Banteng) -->
          <g transform="translate(325, 330) scale(0.65)">
            <path d="M-15 -12 C-30 -20 -45 -45 -35 -55 C-30 -58 -24 -50 -24 -40 C-24 -30 -12 -20 -6 -15 Z" fill="#ffffff"/>
            <path d="M15 -12 C30 -20 45 -45 35 -55 C30 -58 24 -50 24 -40 C24 -30 12 -20 6 -15 Z" fill="#ffffff"/>
            <path d="M-16 -16 L16 -16 C22 0 24 18 16 34 C12 42 -12 42 -16 34 C-24 18 -22 0 -16 -16 Z" fill="#09090b"/>
            <circle cx="-10" cy="5" r="3" fill="#dc2626"/>
            <circle cx="10" cy="5" r="3" fill="#dc2626"/>
            <ellipse cx="0" cy="28" rx="10" ry="6" fill="#27272a"/>
          </g>
        </g>

        <!-- QUADRANT 2: TOP-RIGHT (SILA 3: Pohon Beringin - White Background) -->
        <g id="quadSila3" class="shield-quadrant" data-sila="3">
          <rect x="400" y="250" width="150" height="155" fill="#f8fafc"/>
          <!-- Mini Emblem Sila 3 (Pohon Beringin) -->
          <g transform="translate(475, 330) scale(0.65)">
            <!-- Canopy -->
            <path d="M-35 -15 C-45 -25 -40 -45 -25 -48 C-20 -58 5 -60 15 -52 C30 -58 45 -45 40 -30 C50 -20 40 5 25 2 C15 8 -15 8 -25 2 C-40 2 -45 -10 -35 -15 Z" fill="#15803d"/>
            <!-- Trunk -->
            <path d="M-8 25 L-10 0 Q-18 -12 -25 -20 L-20 -22 Q-12 -10 -6 -4 L-4 -18 L4 -18 L6 -4 Q12 -10 20 -22 L25 -20 Q18 -12 10 0 L8 25 Z" fill="#78350f"/>
            <path d="M-28 40 Q0 30 28 40 Q0 34 -28 40 Z" fill="#78350f"/>
          </g>
        </g>

        <!-- QUADRANT 3: BOTTOM-LEFT (SILA 5: Padi dan Kapas - White Background) -->
        <g id="quadSila5" class="shield-quadrant" data-sila="5">
          <rect x="250" y="405" width="150" height="175" fill="#f8fafc"/>
          <!-- Mini Emblem Sila 5 (Padi & Kapas) -->
          <g transform="translate(325, 480) scale(0.65)">
            <!-- Ribbon -->
            <circle cx="0" cy="35" r="4" fill="#dc2626"/>
            <!-- Padi Left -->
            <path d="M-3 35 C-18 20 -28 0 -24 -25" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
            <ellipse cx="-12" cy="22" rx="4" ry="2" fill="#eab308" transform="rotate(-30 -12 22)"/>
            <ellipse cx="-20" cy="12" rx="4" ry="2" fill="#eab308" transform="rotate(-45 -20 12)"/>
            <ellipse cx="-24" cy="-2" rx="4.5" ry="2.2" fill="#eab308" transform="rotate(-60 -24 -2)"/>
            <ellipse cx="-22" cy="-18" rx="4.5" ry="2.2" fill="#eab308" transform="rotate(-80 -22 -18)"/>
            <!-- Kapas Right -->
            <path d="M3 35 C18 20 28 0 24 -25" fill="none" stroke="#15803d" stroke-width="2.5"/>
            <circle cx="12" cy="18" r="4.5" fill="#ffffff" stroke="#cbd5e1"/>
            <circle cx="20" cy="5" r="4.5" fill="#ffffff" stroke="#cbd5e1"/>
            <circle cx="20" cy="-10" r="4.5" fill="#ffffff" stroke="#cbd5e1"/>
          </g>
        </g>

        <!-- QUADRANT 4: BOTTOM-RIGHT (SILA 2: Rantai Emas - Red Background) -->
        <g id="quadSila2" class="shield-quadrant" data-sila="2">
          <rect x="400" y="405" width="150" height="175" fill="#991b1b"/>
          <!-- Mini Emblem Sila 2 (Rantai) -->
          <g transform="translate(475, 480) scale(0.65)">
            <circle cx="0" cy="0" r="26" fill="none" stroke="#facc15" stroke-width="4.5" stroke-dasharray="6 4"/>
            <circle cx="0" cy="0" r="16" fill="#7f1d1d"/>
          </g>
        </g>

        <!-- Garis Khatulistiwa Tebal (Equator Center Line) -->
        <rect x="240" y="400" width="320" height="10" fill="#09090b" stroke="#d4af37" stroke-width="0.8"/>
        <!-- Vertical Divider -->
        <line x1="400" y1="240" x2="400" y2="580" stroke="#09090b" stroke-width="6"/>
        <line x1="400" y1="240" x2="400" y2="580" stroke="#d4af37" stroke-width="1.2"/>
      </g>

      <!-- CENTER SHIELD: SILA 1 (Bintang Emas - Black Heart Shield) -->
      <g id="centerSila1" class="shield-quadrant" data-sila="1">
        <!-- Heart / Diamond Mini Shield -->
        <path d="M400 345 L455 385 C455 435 400 465 400 465 C400 465 345 435 345 385 Z" fill="#09090b" stroke="#fef08a" stroke-width="3"/>
        <!-- Radiant Star -->
        <g transform="translate(400, 405) scale(0.85)">
          <polygon points="0,-32 8,-10 30,-10 12,4 18,25 0,12 -18,25 -12,4 -30,-10 -8,-10" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
        </g>
      </g>

    </g> <!-- End Shield -->

  </g> <!-- End Garuda Body -->
</svg>