<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .batik-line { stroke: #d4af37; stroke-width: 0.8; stroke-opacity: 0.18; fill: none; }
      .batik-fill { fill: #d4af37; fill-opacity: 0.05; }
      .batik-dot { fill: #d4af37; fill-opacity: 0.25; }
    </style>
  </defs>

  <!-- Kawung Geometry Motif -->
  <!-- Center Intersection Flower -->
  <circle cx="60" cy="60" r="2" class="batik-dot"/>
  <ellipse cx="60" cy="35" rx="14" ry="24" class="batik-line batik-fill"/>
  <ellipse cx="60" cy="85" rx="14" ry="24" class="batik-line batik-fill"/>
  <ellipse cx="35" cy="60" rx="24" ry="14" class="batik-line batik-fill"/>
  <ellipse cx="85" cy="60" rx="24" ry="14" class="batik-line batik-fill"/>

  <!-- Four Corners -->
  <circle cx="0" cy="0" r="2" class="batik-dot"/>
  <circle cx="120" cy="0" r="2" class="batik-dot"/>
  <circle cx="0" cy="120" r="2" class="batik-dot"/>
  <circle cx="120" cy="120" r="2" class="batik-dot"/>

  <ellipse cx="0" cy="25" rx="14" ry="24" class="batik-line batik-fill"/>
  <ellipse cx="120" cy="25" rx="14" ry="24" class="batik-line batik-fill"/>
  <ellipse cx="0" cy="95" rx="14" ry="24" class="batik-line batik-fill"/>
  <ellipse cx="120" cy="95" rx="14" ry="24" class="batik-line batik-fill"/>

  <ellipse cx="25" cy="0" rx="24" ry="14" class="batik-line batik-fill"/>
  <ellipse cx="95" cy="0" rx="24" ry="14" class="batik-line batik-fill"/>
  <ellipse cx="25" cy="120" rx="24" ry="14" class="batik-line batik-fill"/>
  <ellipse cx="95" cy="120" rx="24" ry="14" class="batik-line batik-fill"/>

  <!-- Diagonal Diamond accents -->
  <polygon points="60,10 75,25 60,40 45,25" class="batik-line"/>
  <polygon points="60,80 75,95 60,110 45,95" class="batik-line"/>
  <polygon points="10,60 25,75 40,60 25,45" class="batik-line"/>
  <polygon points="80,60 95,75 110,60 95,45" class="batik-line"/>
</svg>