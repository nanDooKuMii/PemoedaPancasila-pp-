<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRed4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="hornGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="bullShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Shield Section: Red (Merah) -->
  <rect width="200" height="200" rx="24" fill="url(#bgRed4)"/>
  <rect width="192" height="192" x="4" y="4" rx="20" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Bull Head (Kepala Banteng) -->
  <g transform="translate(100, 110)" filter="url(#bullShadow)">
    <!-- Horns (Tanduk Gagah Melengkung ke Atas) -->
    <!-- Left Horn -->
    <path d="M-22 -20 C-45 -30 -65 -65 -50 -80 C-45 -85 -35 -75 -35 -60 C-35 -45 -18 -32 -10 -25 Z" fill="url(#hornGradient)"/>
    <!-- Right Horn -->
    <path d="M22 -20 C45 -30 65 -65 50 -80 C45 -85 35 -75 35 -60 C35 -45 18 -32 10 -25 Z" fill="url(#hornGradient)"/>

    <!-- Horn Base Ribs -->
    <ellipse cx="-20" cy="-22" rx="8" ry="4" fill="#0f172a" transform="rotate(-30 -20 -22)"/>
    <ellipse cx="20" cy="-22" rx="8" ry="4" fill="#0f172a" transform="rotate(30 20 -22)"/>

    <!-- Head & Ears -->
    <!-- Left Ear -->
    <path d="M-30 -10 C-55 -15 -60 0 -45 10 C-35 15 -25 5 -20 -5 Z" fill="#18181b"/>
    <path d="M-45 -2 C-52 -5 -55 2 -48 6 C-42 9 -36 2 -32 -2 Z" fill="#991b1b" opacity="0.6"/>
    
    <!-- Right Ear -->
    <path d="M30 -10 C55 -15 60 0 45 10 C35 15 25 5 20 -5 Z" fill="#18181b"/>
    <path d="M45 -2 C52 -5 55 2 48 6 C42 9 36 2 32 -2 Z" fill="#991b1b" opacity="0.6"/>

    <!-- Main Skull / Face -->
    <path d="M-25 -25 L25 -25 C32 0 35 25 24 50 C18 62 -18 62 -24 50 C-35 25 -32 0 -25 -25 Z" fill="#09090b"/>
    <!-- Forehead Plate -->
    <path d="M-20 -20 Q0 -30 20 -20 Q24 5 18 20 Q0 30 -18 20 Q-24 5 -20 -20 Z" fill="#18181b"/>

    <!-- Fierce Eyes -->
    <polygon points="-24,2 -12,8 -20,14" fill="#ffffff"/>
    <circle cx="-17" cy="8" r="3" fill="#dc2626"/>
    
    <polygon points="24,2 12,8 20,14" fill="#ffffff"/>
    <circle cx="17" cy="8" r="3" fill="#dc2626"/>

    <!-- Snout & Nostrils (Moncong Banteng) -->
    <path d="M-18 35 Q0 32 18 35 Q22 55 0 58 Q-22 55 -18 35 Z" fill="#27272a"/>
    <ellipse cx="-8" cy="46" rx="4" ry="5" fill="#09090b"/>
    <ellipse cx="8" cy="46" rx="4" ry="5" fill="#09090b"/>
    <path d="M-12 55 Q0 58 12 55" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>