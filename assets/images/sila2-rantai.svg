<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRed2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="chainGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="chainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield Section: Red (Merah) -->
  <rect width="200" height="200" rx="24" fill="url(#bgRed2)"/>
  <rect width="192" height="192" x="4" y="4" rx="20" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Connected Chain Loop (Rantai Emas - 9 Bulat & 8 Persegi = 17 Mata Rantai) -->
  <g transform="translate(100, 100)" filter="url(#chainShadow)">
    <!-- Central Soft Glow -->
    <circle cx="0" cy="0" r="60" fill="#000000" fill-opacity="0.25"/>

    <!-- Chain Links in a Ring of radius 50 -->
    <!-- Link 1 (Square) Top 0 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(0)"/>
    <!-- Link 2 (Circle) 22.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(22.5)"/>
    <!-- Link 3 (Square) 45 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(45)"/>
    <!-- Link 4 (Circle) 67.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(67.5)"/>
    <!-- Link 5 (Square) 90 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(90)"/>
    <!-- Link 6 (Circle) 112.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(112.5)"/>
    <!-- Link 7 (Square) 135 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(135)"/>
    <!-- Link 8 (Circle) 157.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(157.5)"/>
    <!-- Link 9 (Square) 180 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(180)"/>
    <!-- Link 10 (Circle) 202.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(202.5)"/>
    <!-- Link 11 (Square) 225 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(225)"/>
    <!-- Link 12 (Circle) 247.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(247.5)"/>
    <!-- Link 13 (Square) 270 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(270)"/>
    <!-- Link 14 (Circle) 292.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(292.5)"/>
    <!-- Link 15 (Square) 315 deg -->
    <rect x="-8" y="-58" width="16" height="16" rx="2" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(315)"/>
    <!-- Link 16 (Circle) 337.5 deg -->
    <circle cx="0" cy="-50" r="8" fill="none" stroke="url(#chainGold)" stroke-width="4.5" transform="rotate(337.5)"/>
  </g>
</svg>