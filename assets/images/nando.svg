<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nandoAura" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blazerNando" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="shadowNando" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Aura Glow Behind Silhouette -->
  <circle cx="200" cy="180" r="170" fill="url(#nandoAura)"/>

  <!-- Main Silhouette Group -->
  <g filter="url(#shadowNando)">
    <!-- Neck -->
    <rect x="180" y="210" width="40" height="60" rx="8" fill="#fbcfe8"/>
    <!-- Head Base -->
    <ellipse cx="200" cy="160" rx="60" ry="70" fill="#fed7aa"/>
    <path d="M140 160 Q200 250 260 160 Z" fill="#fbcfe8" opacity="0.3"/>
    
    <!-- Ears -->
    <ellipse cx="138" cy="162" rx="10" ry="16" fill="#fed7aa"/>
    <ellipse cx="262" cy="162" rx="10" ry="16" fill="#fed7aa"/>

    <!-- Hair (Modern Quiff / Pompadour) -->
    <path d="M136 150 Q140 70 200 60 Q265 65 264 150 Q235 105 200 110 Q160 105 136 150 Z" fill="#09090b"/>
    <path d="M160 90 Q205 70 250 95 Q230 80 180 85 Z" fill="#27272a"/>

    <!-- Eyebrows and Eyes (Minimalist clean anime/flat portrait) -->
    <path d="M160 145 Q175 140 188 145" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M212 145 Q225 140 240 145" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="174" cy="158" r="5" fill="#18181b"/>
    <circle cx="226" cy="158" r="5" fill="#18181b"/>
    <circle cx="176" cy="156" r="1.5" fill="#ffffff"/>
    <circle cx="228" cy="156" r="1.5" fill="#ffffff"/>

    <!-- Nose & Confident Smile -->
    <path d="M200 158 L196 178 L204 178" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M185 195 Q200 206 215 195" stroke="#991b1b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Shoulders & Body / Formal Blazer -->
    <path d="M80 500 L80 340 Q80 250 160 250 L240 250 Q320 250 320 340 L320 500 Z" fill="url(#blazerNando)"/>
    
    <!-- White Shirt & Gold-trimmed Tie -->
    <polygon points="200,360 160,250 240,250" fill="#ffffff"/>
    <!-- Collar Left & Right -->
    <polygon points="160,250 185,300 200,270 190,250" fill="#f1f5f9"/>
    <polygon points="240,250 215,300 200,270 210,250" fill="#f1f5f9"/>
    
    <!-- Red Tie with Gold Accents -->
    <path d="M192 280 L208 280 L214 420 L200 445 L186 420 Z" fill="#b91c1c"/>
    <line x1="190" y1="320" x2="210" y2="320" stroke="#f59e0b" stroke-width="2"/>
    <line x1="188" y1="360" x2="212" y2="360" stroke="#f59e0b" stroke-width="2"/>

    <!-- Indonesian Garuda Pin Badge on Lapel -->
    <circle cx="130" cy="320" r="14" fill="#1e1b4b" stroke="#d4af37" stroke-width="2"/>
    <polygon points="130,311 133,318 140,318 134,322 136,329 130,325 124,329 126,322 120,318 127,318" fill="#fbbf24"/>

    <!-- Leader Gold Epaulette details -->
    <path d="M95 290 Q120 280 140 295" stroke="#d4af37" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M305 290 Q280 280 260 295" stroke="#d4af37" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>